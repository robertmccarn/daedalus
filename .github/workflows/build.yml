name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DOTNETCSHARP.csproj

      - name: Build
        run: dotnet build DOTNETCSHARP.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Daedalus.Tests/Daedalus.Tests.csproj --configuration Release
